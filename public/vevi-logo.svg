<svg viewBox="0 0 168 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sweep & Flip icon mark -->
  <g filter="url(#glow)">
    <!-- Downtrend into sweep low -->
    <line x1="5" y1="20" x2="19" y2="41" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
    <!-- Breakout / flip up -->
    <line x1="19" y1="41" x2="39" y2="5" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
    <!-- Swept level dot (liquidity grab point) -->
    <circle cx="19" cy="41" r="3.5" fill="#22C55E"/>
    <!-- Breakout bar at peak (structure confirmed) -->
    <line x1="33" y1="5" x2="42" y2="5" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark: vevi -->
  <text
    x="54" y="31"
    font-family="'Fira Code', 'Courier New', monospace"
    font-weight="700"
    font-size="26"
    letter-spacing="-1"
    fill="#F8FAFC"
  >vevi</text>
</svg>
